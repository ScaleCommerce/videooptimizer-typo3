name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # composer.lock is not committed: resolve against the current TYPO3 14 release.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: find Classes Configuration Tests ext_*.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: XLF well-formed and en/de ids in parity
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils
          find Resources Configuration -name '*.xlf' -print0 | xargs -0 xmllint --noout
          php Build/xlf-parity.php

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPUnit
        run: vendor/bin/phpunit

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax of the backend modules
        run: |
          for file in Resources/Public/JavaScript/*.js Resources/Public/Js/*.js; do
            node --check --input-type=module < "$file"
          done

      - name: Unit tests
        run: node --test Tests/JavaScript
