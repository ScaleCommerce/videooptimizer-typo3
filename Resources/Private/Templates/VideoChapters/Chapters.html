<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <f:asset.css identifier="videooptimizer" href="EXT:videooptimizer/Resources/Public/Css/videooptimizer.css" />
    <div class="vo-sample vo-sample--chapters">
        <f:render partial="Error" arguments="{error: error}" />

        <f:if condition="{video}">
            <f:render partial="Headline" arguments="{headline: headline, class: 'vo-chapters__headline'}" />
            <f:if condition="{video.processing}">
                <f:then><f:render partial="Processing" arguments="{video: video}" /></f:then>
                <f:else>
                    <f:if condition="{surface}">
                        <div class="vo-chapters" data-vo-chapters=""<f:if condition="{surface.clickSrc}"> data-vo-embed="{surface.clickSrc}"</f:if>>
                            <f:render partial="Surface" arguments="{surface: surface}" />
                            <f:if condition="{scenes}">
                                <f:asset.script identifier="videooptimizer-lightbox" src="EXT:videooptimizer/Resources/Public/Js/videooptimizer.js" type="module" data-vo-version="{surface.assetVersion}" />
                                <ol class="vo-scenes" aria-label="{f:translate(key: 'LLL:EXT:videooptimizer/Resources/Private/Language/locallang_frontend.xlf:scenes.aria')}">
                                    <f:for each="{scenes}" as="scene">
                                        <li class="vo-scenes__item">
                                            <button type="button" class="vo-scene" data-vo-scene="{scene.start}" aria-label="{scene.aria}">
                                                <span class="vo-scene__thumb">
                                                    <img src="{scene.thumb}" alt="" width="320" height="180" loading="lazy" decoding="async" />
                                                    <span class="vo-scene__time">{scene.time}</span>
                                                </span>
                                                <span class="vo-scene__label">{scene.label}</span>
                                            </button>
                                        </li>
                                    </f:for>
                                </ol>
                            </f:if>
                        </div>
                    </f:if>
                </f:else>
            </f:if>
        </f:if>
    </div>
</f:section>
</html>
