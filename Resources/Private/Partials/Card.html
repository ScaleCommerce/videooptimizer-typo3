<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="closeLabel"><f:translate key="LLL:EXT:videooptimizer/Resources/Private/Language/locallang_frontend.xlf:lightbox.close" /></f:variable>
<f:if condition="{video.processing}">
    <f:then>
        <span class="vo-card vo-card--processing">
            <span class="vo-card__media">
                <f:if condition="{video.poster_src}">
                    <img src="{video.poster_src}" alt="" width="640" height="360" loading="lazy" decoding="async" />
                </f:if>
                <span class="vo-card__processing"><f:translate key="LLL:EXT:videooptimizer/Resources/Private/Language/locallang_frontend.xlf:video.processing" /></span>
            </span>
            <span class="vo-card__body"><span class="vo-card__title">{video.title_label}</span></span>
        </span>
    </f:then>
    <f:else>
        <a class="vo-card" href="{video.embed_src}" target="_blank" rel="noopener"
           title="{f:translate(key: 'LLL:EXT:videooptimizer/Resources/Private/Language/locallang_frontend.xlf:video.open', arguments: {0: video.title_label})}"
           data-vo-lightbox="" data-vo-embed="{video.lightbox_url}" data-vo-title="{video.title_label}" data-vo-close-label="{closeLabel}">
            <span class="vo-card__media">
                <f:if condition="{video.poster_src}">
                    <img src="{video.poster_src}" alt="" width="640" height="360" loading="lazy" decoding="async" />
                </f:if>
                <span class="vo-card__play" aria-hidden="true">&#9654;</span>
                <f:if condition="{video.duration_label}">
                    <span class="vo-card__duration">{video.duration_label}</span>
                </f:if>
            </span>
            <span class="vo-card__body">
                <span class="vo-card__title">{video.title_label}</span>
                <span class="vo-card__meta"><f:translate key="LLL:EXT:videooptimizer/Resources/Private/Language/locallang_frontend.xlf:video.views" arguments="{0: video.views}" /></span>
            </span>
        </a>
    </f:else>
</f:if>
</html>
